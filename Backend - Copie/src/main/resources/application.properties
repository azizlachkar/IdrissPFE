spring.application.name=pfe-backend

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
server.port=${SERVER_PORT:8082}
server.error.include-message=always

# ---------------------------------------------------------------------------
# Database (MongoDB)
# ---------------------------------------------------------------------------
# New database name: the schema changed substantially, so the old cmrt_pfe data is
# left untouched rather than migrated.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/cmrt_engineering}
spring.data.mongodb.auto-index-creation=false

# ---------------------------------------------------------------------------
# Authentication
# Override JWT_SECRET in production. It must be at least 32 characters (HS256).
# ---------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:cmrt-pfe-development-secret-key-change-me-in-production-2026}
# 8 hours: one work shift
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# ---------------------------------------------------------------------------
# Client
# ---------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

# ---------------------------------------------------------------------------
# Document store: uploaded revisions are written under this directory
# ---------------------------------------------------------------------------
app.storage.upload-dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# ---------------------------------------------------------------------------
# Demo data: seeds users, products, pipelines and benches on an empty database
# ---------------------------------------------------------------------------
app.seed.enabled=${SEED_ENABLED:true}
app.seed.default-password=${SEED_PASSWORD:Cmrt@2026!Pfe}

# ---------------------------------------------------------------------------
# Email
# Disabled by default so the app runs without SMTP credentials; in-app
# notifications still work. Set MAIL_ENABLED=true plus MAIL_USERNAME and
# MAIL_PASSWORD (a Gmail app password) to turn delivery on.
# Never commit real credentials to this file.
# ---------------------------------------------------------------------------
app.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.level.com.cmrt.pfe=INFO
